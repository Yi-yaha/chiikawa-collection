<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="吉伊卡哇圖鑑">
  <meta property="og:description" content="吉伊卡哇圖鑑已搬到新網址。">
  <meta property="og:image" content="https://chiikawa-collection.pages.dev/assets/favicon-512.png">
  <link rel="canonical" href="https://chiikawa-collection.pages.dev/">
  <title>吉伊卡哇圖鑑已搬家</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F7F5F1; color:#3B332D;
      font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
    a { color:#A75D59; font-weight:600; }
  </style>
  <script>
    // 吉伊卡哇圖鑑已搬到 chiikawa-collection.pages.dev。
    // 這頁把舊網址導到新網址的同一頁（保留好友代碼等網址參數），新網址會顯示搬家提醒；
    // 並把這台裝置上未登入時的收藏放在網址 # 後面一起帶過去（# 後面的內容不會傳到任何伺服器）。
    // 登入帳號的收藏存在雲端，登入資料不搬移，到新網址重新登入即可。
    (function (global) {
      var NEW_ORIGIN = 'https://chiikawa-collection.pages.dev';
      var OLD_BASE = '/chiikawa-collection/';
      var MARK = '#chiikawa-transfer=';
      var LIMIT = 1500000;

      function targetPath(pathname) {
        var rest = pathname.indexOf(OLD_BASE) === 0 ? pathname.slice(OLD_BASE.length) : pathname.replace(/^\/+/, '');
        try { rest = decodeURI(rest); rest = encodeURI(rest); } catch (error) {}
        if (rest === '' || rest === 'index.html') return '/';
        if (/(^|\/)index\.html$/.test(rest)) return '/' + rest.slice(0, -'index.html'.length);
        if (/\.html$/.test(rest)) return '/' + rest.slice(0, -'.html'.length);
        return '/' + rest;
      }
      function transferKey(key) {
        return key === 'chiikawa-collection-v1' || key === 'chiikawa-collection-v1-last-clear' ||
          key === 'chiikawa-collection-v1-filters-expanded' || key.indexOf('chiikawa-collection-v1-migration-') === 0 ||
          key.indexOf('chiikawa-feature-intro-seen-') === 0;
      }
      function encode(text) {
        var bytes = new global.TextEncoder().encode(text), binary = '';
        for (var index = 0; index < bytes.length; index += 0x8000) {
          binary += String.fromCharCode.apply(null, bytes.subarray(index, index + 0x8000));
        }
        return global.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function transfer() {
        try {
          var storage = global.localStorage, items = {}, count = 0;
          for (var index = 0; index < storage.length; index += 1) {
            var key = storage.key(index);
            if (!transferKey(key)) continue;
            var value = storage.getItem(key);
            if (typeof value === 'string') { items[key] = value; count += 1; }
          }
          if (!count) return '';
          var encoded = encode(JSON.stringify({ v:1, items:items }));
          return encoded.length <= LIMIT ? MARK + encoded : '';
        } catch (error) { return ''; }
      }

      var location = global.location;
      var data = transfer();
      var target = NEW_ORIGIN + targetPath(location.pathname) + location.search + (data || '#chiikawa-moved');
      global.__chiikawaRedirectTarget = target;
      location.replace(target);
    })(window);
  </script>
</head>
<body>
  <main>
    <h1>吉伊卡哇圖鑑搬家了</h1>
    <p>正在前往新網址……</p>
    <p><a href="https://chiikawa-collection.pages.dev/">https://chiikawa-collection.pages.dev/</a></p>
  </main>
</body>
</html>
